name: Gerar APK - Assistente Financeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -n 1)
          mkdir projeto
          unzip -q "$ZIP" -d projeto

      - name: Localizar projeto Android
        run: |
          ROOT=$(find projeto -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "Projeto Android não encontrado"
            find projeto -maxdepth 5 -type f
            exit 1
          fi
          echo "Projeto encontrado em: $(dirname "$ROOT")"
          echo "ANDROID_ROOT=$(dirname "$ROOT")" >> $GITHUB_ENV

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        run: |
          cd "$ANDROID_ROOT"
          gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistenteFinanceiro-APK
          path: |
            **/build/outputs/apk/**/*.apk
