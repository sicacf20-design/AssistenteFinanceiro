name: Gerar APK - Assistente Financeiro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Encontrar e extrair projeto
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)
          mkdir projeto
          unzip -q "$ZIP" -d projeto

      - name: Encontrar projeto Android
        run: |
          echo "Conteúdo extraído:"
          find projeto -maxdepth 4 -type f | head -100

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          GRADLEW=$(find projeto -type f -name "gradlew" | head -n 1)
          chmod +x "$GRADLEW"
          cd "$(dirname "$GRADLEW")"
          ./gradlew assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AssistenteFinanceiro-APK
          path: |
            projeto/**/build/outputs/apk/**/*.apk
